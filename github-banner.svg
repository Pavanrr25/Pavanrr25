<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#111c24"/>
      <stop offset="100%" stop-color="#0f2a1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6DB33F"/>
      <stop offset="100%" stop-color="#61DAFB"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#6DB33F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6DB33F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>

  <!-- Left text block -->
  <text x="80" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8b949e" letter-spacing="3">HELLO, WORLD — I'M</text>
  <text x="78" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Pavan Rathod</text>
  <rect x="80" y="192" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1d9">Java Full-Stack Developer</text>

  <!-- Tech chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="80" y="258" width="118" height="32" rx="16" fill="#6DB33F" fill-opacity="0.15" stroke="#6DB33F"/>
    <text x="139" y="279" text-anchor="middle" fill="#6DB33F">Spring Boot</text>
    <rect x="210" y="258" width="88" height="32" rx="16" fill="#61DAFB" fill-opacity="0.12" stroke="#61DAFB"/>
    <text x="254" y="279" text-anchor="middle" fill="#61DAFB">React.js</text>
    <rect x="310" y="258" width="80" height="32" rx="16" fill="#ED8B00" fill-opacity="0.15" stroke="#ED8B00"/>
    <text x="350" y="279" text-anchor="middle" fill="#ED8B00">Java</text>
    <rect x="402" y="258" width="82" height="32" rx="16" fill="#4479A1" fill-opacity="0.2" stroke="#5a9bd5"/>
    <text x="443" y="279" text-anchor="middle" fill="#7fb3e0">MySQL</text>
  </g>

  <!-- Code window -->
  <g transform="translate(790,58)">
    <rect width="410" height="204" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="6" fill="#27c93f"/>
    <text x="205" y="25" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8b949e">Developer.java</text>
    <g font-family="Consolas, Menlo, monospace" font-size="15">
      <text x="22" y="66"><tspan fill="#6DB33F">@RestController</tspan></text>
      <text x="22" y="92"><tspan fill="#ff7b72">public class</tspan><tspan fill="#ffa657"> Pavan</tspan><tspan fill="#c9d1d9"> {</tspan></text>
      <text x="42" y="118"><tspan fill="#ff7b72">String</tspan><tspan fill="#c9d1d9"> role = </tspan><tspan fill="#a5d6ff">"Full-Stack"</tspan><tspan fill="#c9d1d9">;</tspan></text>
      <text x="42" y="144"><tspan fill="#ff7b72">String</tspan><tspan fill="#c9d1d9"> focus = </tspan><tspan fill="#a5d6ff">"APIs + AI"</tspan><tspan fill="#c9d1d9">;</tspan></text>
      <text x="42" y="170"><tspan fill="#ff7b72">boolean</tspan><tspan fill="#c9d1d9"> openToWork = </tspan><tspan fill="#79c0ff">true</tspan><tspan fill="#c9d1d9">;</tspan></text>
      <text x="22" y="194"><tspan fill="#c9d1d9">}</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
